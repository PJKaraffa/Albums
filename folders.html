<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse the Karaffa Vault by genre and style.">
  <title>Genre & Styles | Karaffa Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=12">
  <link rel="stylesheet" href="folders.css?v=12">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <div class="folder-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="mini-record"></span><span>Karaffa Vault</span></a>
      <nav>
        <a class="nav-item nav-link" href="index.html">◉ <span>My Collection</span></a>
        <a class="nav-item nav-link active" href="folders.html">▣ <span>Genre &amp; Styles</span></a>
      </nav>
      <div class="side-footer"><div class="avatar" id="avatar">P</div><div><strong id="userName">Collector</strong><button id="signOut" class="signout">Sign out</button></div></div>
    </aside>

    <main class="folder-main">
      <header class="folder-header">
        <div><p class="eyebrow">FAST BROWSE</p><h1 id="pageTitle">Genre Folders</h1><p id="pageSubtitle">Choose a genre, then open one of its styles.</p></div>
        <a class="primary back-link" href="index.html">＋ Add album</a>
      </header>

      <div id="breadcrumbs" class="breadcrumbs"><button data-level="genres">All Genres</button></div>

      <section class="folder-tools">
        <div class="search-wrap">⌕<input id="folderSearch" type="search" placeholder="Search folders or albums…"></div>
        <span id="resultSummary" class="result-summary"></span>
      </section>

      <section id="folderGrid" class="folder-grid"></section>
      <section id="folderAlbums" class="album-grid folder-albums"></section>
      <div id="folderEmpty" class="empty hidden"><div class="empty-record">♪</div><h3>Nothing found</h3><p>Try another search or add a genre and style to an album.</p></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="folders.js?v=12"></script>
</body>
</html>
